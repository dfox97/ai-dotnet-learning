name: Deploy personal alpha

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the exact CI-approved commit for GitHub Pages
        run: npm run build -- --mode pages
      - name: Add SPA fallback for direct learning links
        run: cp dist/index.html dist/404.html
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository yet. Enable Settings > Pages > Source: GitHub Actions, then rerun this workflow."
          else
            echo "Unexpected GitHub Pages API response: HTTP $status" >&2
            exit 1
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Smoke-check published entry and routed learning locations
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"

          smoke() {
            path="$1"
            label="$2"
            body=$(mktemp)
            status=$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' "${base}${path}")

            # GitHub Pages serves the SPA fallback as 404.html for direct deep links.
            # The document is still expected to contain the production app shell so client routing can recover it.
            if [ "$status" != "200" ] && [ "$status" != "404" ]; then
              echo "$label returned unexpected HTTP $status" >&2
              exit 1
            fi

            grep -q '<div id="root"></div>' "$body" || {
              echo "$label did not return the ReviewLab app shell" >&2
              exit 1
            }
          }

          smoke "/" "Entry"
          smoke "/lessons/csharp-foundations" "Lesson deep link"
          smoke "/diagnostics/baseline-production-review" "Diagnostic"
          smoke "/report" "Report"
          smoke "/capstone" "Capstone guidance"
